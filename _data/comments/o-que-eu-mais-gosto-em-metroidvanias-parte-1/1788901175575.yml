name: Renato HardxCore
message: "Buenas, para mim seria assim (bem resumido):\r\n1 - Controle \r\n2 - Vania (por pouco)\r\n3 - Um misto dos dois seria interessante, mas realmente gosto dos dois tipos.\r\n4 - Um misto dos dois também, seria o mais divertido para mim.\r\n5 - Exploração às cegas, com certeza, mas que o jogo te dê recursos mínimos para que vc não empaque e deixe de progredir, como marcadores no mapa, sem frescura para usar.\r\n6 - História. Para mim, uma boa história me causa mais imersão no jogo, aumentando mais o interesse."
