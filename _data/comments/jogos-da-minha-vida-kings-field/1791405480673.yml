message: "Talvez objetivamente esses gráficos 3D da primeira geração sejam toscos, mas eles têm um charme pra mim. Eu também joguei muito esses demos dos CDs que vinham com o videogame.\r\n\r\nQuanto a King's Field, o nome do jogo só me é familiar porque eu tinha aqueles almanaques com dicas pra incontáveis jogos (a maioria eu não conhecia) e lembro demais de ver King's Field na lista.\r\n\r\nJá no aguardo do post sobre PO'ed, de quem eu nunca tinha ouvido falar."
