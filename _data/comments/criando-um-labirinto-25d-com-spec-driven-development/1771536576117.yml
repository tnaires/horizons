message: "Muito legal!\r\nAchei massa que ele obedeceu e usou realmente só HTML, CSS e JS pra chegar no resultado final. Na minha experiencia, os agentes costumam gostar de usar frameworks e libraries populares, mas chegar no resultado com plain js mostra que ele realmente considerou todas as especificações direitinho.\r\n\r\nQuero ler mais posts seus como esse, deu até uma vontade de testar em algum projetinho pessoal :)"
